version: 2
updates:
  - package-ecosystem: "gomod"
    directories:
      - "/closer"
      - "/ctxkey"
      - "/deferred"
      - "/dispatcher"
      - "/prommetrics"
      - "/prommetrics/exemplar"
      - "/protomap"
      - "/slogger"
      - "/slogger/grpcslog"
      - "/strcase"
      - "/sync"
      - "/time"
    schedule:
      interval: "daily"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
